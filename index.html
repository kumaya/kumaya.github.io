    /* Side-by-side Layout Wrapper */
    .content-split-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    /* Compact Deck Section Styling */
    .timeline-deck-container {
      position: relative;
      width: 100%;
      height: 220px;
      margin: 10px auto 0 auto;
      perspective: 800px;
    }

    .deck-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .deck-card {
      position: absolute;
      width: 220px;
      height: 160px;
      left: 50%;
      top: 10px;
      margin-left: -110px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 16px 12px;
      text-align: center;
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      opacity: 0;
      visibility: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Active Front Card */
    .deck-card.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(0) scale(1) translateZ(0);
      z-index: 3;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.18);
    }

    /* Left Card */
    .deck-card.prev {
      opacity: 0.5;
      visibility: visible;
      transform: translateX(-120px) scale(0.8) translateZ(-80px);
      z-index: 2;
      cursor: pointer;
    }

    /* Right Card */
    .deck-card.next {
      opacity: 0.5;
      visibility: visible;
      transform: translateX(120px) scale(0.8) translateZ(-80px);
      z-index: 2;
      cursor: pointer;
    }

    /* Hidden Rear Cards */
    .deck-card.hidden-card {
      opacity: 0;
      visibility: hidden;
      transform: translateX(0) scale(0.5) translateZ(-150px);
      z-index: 1;
    }

    .company-logo {
      max-height: 40px;
      max-width: 120px;
      margin-bottom: 10px;
      object-fit: contain;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));
    }

    .timeline-title {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }

    .timeline-role {
      font-size: 12px;
      color: #e0e0e0;
      font-weight: 500;
    }

    /* Deck Navigation Controls */
    .deck-controls {
      text-align: center;
      margin-top: -15px;
      margin-bottom: 15px;
      position: relative;
      z-index: 10;
    }

    .deck-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      line-height: 30px;
      padding: 0;
      margin: 0 8px;
      outline: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .deck-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.1);
    }

    .deck-dots {
      display: inline-block;
      margin: 0 8px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      margin: 0 3px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active-dot {
      background: #fff;
      width: 18px;
      border-radius: 8px;
    }

    /* Links Panel Styling */
    .links-side-panel {
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .links-side-panel .social-group {
      margin-bottom: 20px;
    }

    .links-side-panel .social-group a {
      margin: 0 10px;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .links-side-panel .social-group a:hover {
      transform: scale(1.15);
    }

    .links-side-panel .docs-group a {
      margin: 0 15px;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .links-side-panel .docs-group a:hover {
      transform: scale(1.15);
    }

    @media (max-width: 768px) {
      .content-split-row {
        display: block;
      }
      .links-side-panel {
        margin-top: 30px;
      }
      .deck-card.prev {

      }
      .deck-card.next {
        transform: translateX(70px) scale(0.75) translateZ(-80px);
      }
    }
  </style>

    <!-- Deck Rotation Engine Script -->
    <script>
      $(document).ready(function () {
        const cards = $('.deck-card');
        const totalCards = cards.length;
        let currentIndex = 0;
        let autoRotateTimer = null;

        // Create indicator dots dynamically
        for (let i = 0; i < totalCards; i++) {
          $('#deckDots').append('<span class="dot" data-index="' + i + '"></span>');
        }
        const dots = $('.dot');

        function updateDeck() {
          cards.removeClass('active prev next hidden-card');
          dots.removeClass('active-dot');

          cards.each(function (index) {
            if (index === currentIndex) {
              $(this).addClass('active');
            } else if (index === (currentIndex - 1 + totalCards) % totalCards) {
              $(this).addClass('prev');
            } else if (index === (currentIndex + 1) % totalCards) {
              $(this).addClass('next');
            } else {
              $(this).addClass('hidden-card');
            }
          });

          dots.eq(currentIndex).addClass('active-dot');
        }

        function nextCard() {
          currentIndex = (currentIndex + 1) % totalCards;
          updateDeck();
        }

        function prevCard() {
          currentIndex = (currentIndex - 1 + totalCards) % totalCards;
          updateDeck();
        }

        function startAutoRotate() {
          if (!autoRotateTimer) {
            autoRotateTimer = setInterval(nextCard, 1500);
          }
        }

        function stopAutoRotate() {
          clearInterval(autoRotateTimer);
          autoRotateTimer = null;
        }

        // Event listeners
        $('#nextBtn').click(function () {
          nextCard();
        });

        $('#prevBtn').click(function () {
          prevCard();
        });

        $(document).on('click', '.deck-card.next', function () {
          nextCard();
        });

        $(document).on('click', '.deck-card.prev', function () {
          prevCard();
        });

        dots.click(function () {
          currentIndex = parseInt($(this).attr('data-index'));
          updateDeck();
        });

        // Pause rotation on hover
        $('#timelineDeck, .deck-controls').hover(stopAutoRotate, startAutoRotate);

        // Initialize deck
        updateDeck();
        startAutoRotate();
      });
    </script>
