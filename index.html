  <style>
    /* Deck Section Styling */
    .timeline-deck-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 320px;
      margin: 40px auto 30px auto;
      perspective: 1000px;
    }

    .deck-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .deck-card {
      position: absolute;
      width: 280px;
      height: 220px;
      left: 50%;
      top: 20px;
      margin-left: -140px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
      opacity: 0;
      visibility: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Active Front Card */
    .deck-card.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(0) scale(1) translateZ(0);
      z-index: 3;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.18);
    }

    /* Left Card */
    .deck-card.prev {
      opacity: 0.6;
      visibility: visible;
      transform: translateX(-180px) scale(0.82) translateZ(-100px);
      z-index: 2;
      cursor: pointer;
    }

    /* Right Card */
    .deck-card.next {
      opacity: 0.6;
      visibility: visible;
      transform: translateX(180px) scale(0.82) translateZ(-100px);
      z-index: 2;
      cursor: pointer;
    }

    /* Hidden Rear Cards */
    .deck-card.hidden-card {
      opacity: 0;
      visibility: hidden;
      transform: translateX(0) scale(0.6) translateZ(-200px);
      z-index: 1;
    }

    .company-logo {
      max-height: 55px;
      max-width: 150px;
      margin-bottom: 15px;
      object-fit: contain;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));
    }

    .timeline-title {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 6px;
    }

    .timeline-role {
      font-size: 14px;
      color: #e0e0e0;
      font-weight: 500;
    }

    /* Deck Navigation Controls */
    .deck-controls {
      text-align: center;
      margin-top: -30px;
      margin-bottom: 30px;
      position: relative;
      z-index: 10;
    }

    .deck-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      margin: 0 10px;
      outline: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .deck-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.1);
    }

    .deck-dots {
      display: inline-block;
      margin: 0 10px;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      margin: 0 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active-dot {
      background: #fff;
      width: 24px;
      border-radius: 10px;
    }

    @media (max-width: 768px) {
      .deck-card.prev {
        transform: translateX(-100px) scale(0.75) translateZ(-100px);
      }
      .deck-card.next {
        transform: translateX(100px) scale(0.75) translateZ(-100px);
      }
    }
  </style>

    <!-- Deck Rotation Engine Script -->
    <script>
      $(document).ready(function () {
        const cards = $('.deck-card');
        const totalCards = cards.length;
        let currentIndex = 0;
        let autoRotateTimer = null;

        // Create indicator dots dynamically
        for (let i = 0; i < totalCards; i++) {
          $('#deckDots').append('<span class="dot" data-index="' + i + '"></span>');
        }
        const dots = $('.dot');

        function updateDeck() {
          cards.removeClass('active prev next hidden-card');
          dots.removeClass('active-dot');

          cards.each(function (index) {
            if (index === currentIndex) {
              $(this).addClass('active');
            } else if (index === (currentIndex - 1 + totalCards) % totalCards) {
              $(this).addClass('prev');
            } else if (index === (currentIndex + 1) % totalCards) {
              $(this).addClass('next');
            } else {
              $(this).addClass('hidden-card');
            }
          });

          dots.eq(currentIndex).addClass('active-dot');
        }

        function nextCard() {
          currentIndex = (currentIndex + 1) % totalCards;
          updateDeck();
        }

        function prevCard() {
          currentIndex = (currentIndex - 1 + totalCards) % totalCards;
          updateDeck();
        }

        function startAutoRotate() {
          if (!autoRotateTimer) {
            autoRotateTimer = setInterval(nextCard, 3500);
          }
        }

        function stopAutoRotate() {
          clearInterval(autoRotateTimer);
          autoRotateTimer = null;
        }

        // Event listeners
        $('#nextBtn').click(function () {
          nextCard();
        });

        $('#prevBtn').click(function () {
          prevCard();
        });

        $(document).on('click', '.deck-card.next', function () {
          nextCard();
        });

        $(document).on('click', '.deck-card.prev', function () {
          prevCard();
        });

        dots.click(function () {
          currentIndex = parseInt($(this).attr('data-index'));
          updateDeck();
        });

        // Pause rotation on hover
        $('#timelineDeck, .deck-controls').hover(stopAutoRotate, startAutoRotate);

        // Initialize deck
        updateDeck();
        startAutoRotate();
      });
    </script>
